<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 366" role="img" aria-label="Typical layered load balancer architecture from client to app servers" style="font:13px/1.3 ui-sans-serif,system-ui,sans-serif;">
  <style>
    svg{color:#243044;}
    .flow{stroke:#0d96a3;}
    .flowfill{fill:#0d96a3;}
    .hl{fill:#5b5ef0;fill-opacity:.16;stroke:#5b5ef0;}
    .hl-solid{fill:#5b5ef0;stroke:#5b5ef0;}
    .on-hl{fill:#ffffff;}
    .step{fill:#64748b;stroke:#64748b;}
  </style>
  <defs>
    <marker id="lb-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto">
      <path class="flowfill" d="M0,1 L9,5 L0,9 z" fill="currentColor"/>
    </marker>
  </defs>
  <g fill="none" stroke="currentColor" stroke-width="2">
    <rect x="270" y="14" width="100" height="38" rx="8"/>
    <rect x="270" y="82" width="100" height="38" rx="8"/>
    <rect class="hl" x="240" y="150" width="160" height="44" rx="10" fill="currentColor" fill-opacity="0.1" stroke="currentColor" />
    <rect class="hl" x="240" y="224" width="160" height="44" rx="10" fill="currentColor" fill-opacity="0.1" stroke="currentColor" />
    <rect x="92" y="298" width="132" height="42" rx="8"/>
    <rect x="254" y="298" width="132" height="42" rx="8"/>
    <rect x="416" y="298" width="132" height="42" rx="8"/>
  </g>
  <g fill="currentColor" text-anchor="middle">
    <text x="320" y="38">Client</text>
    <text x="320" y="106">DNS / Anycast</text>
    <text x="320" y="177" font-weight="600">Edge L4 LB</text>
    <text x="320" y="251" font-weight="600">L7 LB / Gateway</text>
    <text x="158" y="324">App svc A</text>
    <text x="320" y="324">App svc B</text>
    <text x="482" y="324">App svc C</text>
  </g>
  <g font-size="11" fill="currentColor" opacity="0.75">
    <text x="412" y="176">TLS, DDoS</text>
    <text x="412" y="250">routing, auth, RL</text>
  </g>
  <g class="flow" stroke="currentColor" stroke-width="2" fill="none">
    <path class="flow" d="M320 52 V82" marker-end="url(#lb-ah)" />
    <path class="flow" d="M320 120 V150" marker-end="url(#lb-ah)" />
    <path class="flow" d="M320 194 V224" marker-end="url(#lb-ah)" />
    <path d="M320 268 V284"/>
    <path d="M158 284 H482"/>
    <path class="flow" d="M158 284 V298" marker-end="url(#lb-ah)" />
    <path class="flow" d="M320 284 V298" marker-end="url(#lb-ah)" />
    <path class="flow" d="M482 284 V298" marker-end="url(#lb-ah)" />
  </g>
</svg>