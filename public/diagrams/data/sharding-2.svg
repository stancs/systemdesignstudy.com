<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 245" role="img" aria-label="Cross-shard query before and after colocating related tables" style="font:12px/1.3 ui-sans-serif,system-ui,sans-serif;">
  <style>
    svg{color:#243044;}
    .flow{stroke:#0d96a3;}
    .flowfill{fill:#0d96a3;}
    .hl{fill:#5b5ef0;fill-opacity:.16;stroke:#5b5ef0;}
    .hl-solid{fill:#5b5ef0;stroke:#5b5ef0;}
    .on-hl{fill:#ffffff;}
    .step{fill:#64748b;stroke:#64748b;}
  </style>
  <text x="320" y="22" text-anchor="middle" fill="currentColor" font-weight="600">Colocate by the same shard key to avoid scatter-gather</text>
  <g transform="translate(0,45)">
    <text x="160" y="0" text-anchor="middle" fill="currentColor" font-weight="600">Without colocation</text>
    <g fill="none" stroke="currentColor" stroke-width="2">
      <rect x="30" y="20" width="80" height="50" rx="6"/>
      <rect x="120" y="20" width="80" height="50" rx="6"/>
      <rect x="210" y="20" width="80" height="50" rx="6"/>
      <rect x="30" y="90" width="80" height="50" rx="6"/>
      <rect x="120" y="90" width="80" height="50" rx="6"/>
      <rect x="210" y="90" width="80" height="50" rx="6"/>
    </g>
    <g fill="currentColor" text-anchor="middle" font-size="11">
      <text x="70" y="40" font-weight="600">users A</text>
      <text x="160" y="40" font-weight="600">users B</text>
      <text x="250" y="40" font-weight="600">users C</text>
      <text x="70" y="110" font-weight="600">orders A</text>
      <text x="160" y="110" font-weight="600">orders B</text>
      <text x="250" y="110" font-weight="600">orders C</text>
    </g>
    <g class="flow" stroke="currentColor" stroke-width="1.5" stroke-dasharray="3 3" fill="none">
      <path d="M70 70 V90"/>
      <path d="M70 70 V80 H160 V90"/>
      <path d="M70 70 V80 H250 V90"/>
    </g>
    <text x="160" y="170" text-anchor="middle" fill="currentColor" font-size="11">JOIN touches all shards</text>
  </g>
  <g transform="translate(320,45)">
    <text x="160" y="0" text-anchor="middle" fill="currentColor" font-weight="600">With colocation by user_id</text>
    <g fill="none" stroke="currentColor" stroke-width="2">
      <rect class="hl" x="30" y="20" width="80" height="50" rx="6" fill="currentColor" fill-opacity="0.1" stroke="currentColor" />
      <rect x="120" y="20" width="80" height="50" rx="6"/>
      <rect x="210" y="20" width="80" height="50" rx="6"/>
      <rect class="hl" x="30" y="90" width="80" height="50" rx="6" fill="currentColor" fill-opacity="0.1" stroke="currentColor" />
      <rect x="120" y="90" width="80" height="50" rx="6"/>
      <rect x="210" y="90" width="80" height="50" rx="6"/>
    </g>
    <g fill="currentColor" text-anchor="middle" font-size="11">
      <text x="70" y="40" font-weight="600">users A</text>
      <text x="160" y="40" font-weight="600">users B</text>
      <text x="250" y="40" font-weight="600">users C</text>
      <text x="70" y="110" font-weight="600">orders A</text>
      <text x="160" y="110" font-weight="600">orders B</text>
      <text x="250" y="110" font-weight="600">orders C</text>
    </g>
    <g class="flow" stroke="currentColor" stroke-width="2" fill="none">
      <path d="M70 70 V90"/>
    </g>
    <text x="160" y="170" text-anchor="middle" fill="currentColor" font-size="11">JOIN stays on one shard</text>
  </g>
</svg>