<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" role="img" aria-label="Single-leader replication: one writer, many readers" style="font:13px/1.3 ui-sans-serif,system-ui,sans-serif;">
  <style>
    svg{color:#243044;}
    .flow{stroke:#0d96a3;}
    .flowfill{fill:#0d96a3;}
    .hl{fill:#5b5ef0;fill-opacity:.16;stroke:#5b5ef0;}
    .hl-solid{fill:#5b5ef0;stroke:#5b5ef0;}
    .on-hl{fill:#ffffff;}
    .step{fill:#64748b;stroke:#64748b;}
  </style>
  <defs>
    <marker id="rep-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path class="flowfill" d="M0,1 L9,5 L0,9 z" fill="currentColor"/>
    </marker>
  </defs>
  <text x="320" y="22" text-anchor="middle" fill="currentColor" font-weight="600">Single-leader replication</text>
  <g fill="none" stroke="currentColor" stroke-width="2">
    <rect class="hl" x="240" y="50" width="160" height="50" rx="10" fill="currentColor" fill-opacity="0.1" stroke="currentColor" />
    <rect x="60" y="170" width="140" height="50" rx="10"/>
    <rect x="250" y="170" width="140" height="50" rx="10"/>
    <rect x="440" y="170" width="140" height="50" rx="10"/>
  </g>
  <g fill="currentColor" text-anchor="middle">
    <text x="320" y="72" font-weight="700">Leader</text>
    <text x="320" y="90" font-size="11">accepts writes</text>
    <text x="130" y="192" font-weight="600">Follower 1</text>
    <text x="130" y="210" font-size="11">read replica</text>
    <text x="320" y="192" font-weight="600">Follower 2</text>
    <text x="320" y="210" font-size="11">read replica</text>
    <text x="510" y="192" font-weight="600">Follower 3</text>
    <text x="510" y="210" font-size="11">read replica</text>
  </g>
  <g class="flow" stroke="currentColor" stroke-width="2" fill="none">
    <path class="flow" d="M320 100 L130 170" marker-end="url(#rep-ah)"/>
    <path class="flow" d="M320 100 V170" marker-end="url(#rep-ah)"/>
    <path class="flow" d="M320 100 L510 170" marker-end="url(#rep-ah)"/>
  </g>
  <text x="320" y="252" text-anchor="middle" fill="currentColor" font-size="11" opacity="0.7">Writes go to one node; reads scale by adding followers (with replication lag).</text>
</svg>