  <path d="M240 130 H400" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="320" y="124" text-anchor="middle" fill="currentColor" font-weight="600" font-size="11">JOIN on user_id</text>
