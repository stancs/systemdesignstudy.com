<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 246" role="img" aria-label="A relational model with rows, columns, and a join" style="font:12px/1.3 ui-sans-serif,system-ui,sans-serif;">
  <style>
    svg{color:#243044;}
    .flow{stroke:#0d96a3;}
    .flowfill{fill:#0d96a3;}
    .hl{fill:#5b5ef0;fill-opacity:.16;stroke:#5b5ef0;}
    .hl-solid{fill:#5b5ef0;stroke:#5b5ef0;}
    .on-hl{fill:#ffffff;}
    .step{fill:#64748b;stroke:#64748b;}
  </style>
  <text x="320" y="22" text-anchor="middle" fill="currentColor" font-weight="600">SQL: structured rows joined by keys</text>
  <g fill="none" stroke="currentColor" stroke-width="2">
