<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" role="img" aria-label="Composite index on (country, city, zip) and which queries it serves" style="font:13px/1.3 ui-sans-serif,system-ui,sans-serif;">
  <style>
    svg{color:#243044;}
    .flow{stroke:#0d96a3;}
    .flowfill{fill:#0d96a3;}
    .hl{fill:#5b5ef0;fill-opacity:.16;stroke:#5b5ef0;}
    .hl-solid{fill:#5b5ef0;stroke:#5b5ef0;}
    .on-hl{fill:#ffffff;}
    .step{fill:#64748b;stroke:#64748b;}
  </style>
  <text x="320" y="22" text-anchor="middle" fill="currentColor" font-weight="600">Composite index on (country, city, zip)</text>
  <g fill="none" stroke="currentColor" stroke-width="2">
    <rect class="hl" x="40" y="50" width="120" height="40" rx="8" fill="currentColor" fill-opacity="0.1" stroke="currentColor" />
    <rect class="hl" x="180" y="50" width="120" height="40" rx="8" fill="currentColor" fill-opacity="0.1" stroke="currentColor" />
    <rect class="hl" x="320" y="50" width="120" height="40" rx="8" fill="currentColor" fill-opacity="0.1" stroke="currentColor" />
  </g>
  <g fill="currentColor" text-anchor="middle">
    <text x="100" y="74" font-weight="700">country</text>
    <text x="240" y="74" font-weight="700">city</text>
    <text x="380" y="74" font-weight="700">zip</text>
  </g>
  <g font-size="12" fill="currentColor">
    <text x="40" y="130">✓ WHERE country = 'US'</text>
    <text x="40" y="152">✓ WHERE country = 'US' AND city = 'SF'</text>
    <text x="40" y="174">✓ WHERE country = 'US' AND city = 'SF' AND zip = '94107'</text>
    <text x="40" y="200" fill="currentColor">✗ WHERE city = 'SF'  — leading column missing → index unused</text>
  </g>
</svg>