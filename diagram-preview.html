<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diagram colour preview</title>
<style>
  :root{ --pg:#ffffff; --tx:#243044; }
  body{ margin:0; padding:32px clamp(16px,4vw,64px); background:var(--pg); color:var(--tx);
        font:15px/1.5 ui-sans-serif,system-ui,sans-serif; transition:background .2s,color .2s; }
  h1{ font-size:20px; margin:0 0 4px; }
  .sub{ opacity:.7; margin:0 0 24px; font-size:13px; }
  h2{ grid-column:1/-1; font-size:13px; text-transform:uppercase; letter-spacing:.08em; opacity:.6;
      margin:32px 0 0; border-bottom:1px solid currentColor; padding-bottom:6px; }
  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(420px,1fr)); gap:20px; }
  figure{ margin:0; border:1px solid color-mix(in srgb, currentColor 18%, transparent);
          border-radius:12px; padding:14px 16px 18px; }
  figcaption{ font-size:12px; opacity:.55; margin-bottom:8px; font-family:ui-monospace,Menlo,monospace; }
  figure svg{ width:100%; height:auto; }
  .toggle{ position:sticky; top:16px; float:right; z-index:9; }
  button{ font:inherit; font-size:13px; padding:8px 16px; border-radius:999px; cursor:pointer;
          border:1px solid color-mix(in srgb, currentColor 35%, transparent);
          background:color-mix(in srgb, currentColor 8%, transparent); color:inherit; }

  /* dark mode mirrors the live site: the diagram is filtered, not re-styled */
  body.dark{ --pg:#161b29; --tx:#e6ebf4; }
  body.dark .diag svg{ filter:invert(1) hue-rotate(180deg); }
</style>
</head>
<body>
<div class="toggle"><button id="t">Switch to dark</button></div>
<h1>System Design Study — diagram colours</h1>
<p class="sub">All 51 diagrams. Use the toggle to preview light vs dark — it applies the same invert + hue-rotate filter the live site uses, so this matches what visitors see when they switch the site theme.</p>
<div class="grid">
<h2>data</h2>
<figure class="diag"><figcaption>caching-1.svg</figcaption><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" role="img" aria-label="The chain of caches between user and origin" style="font:12px/1.3 ui-sans-serif,system-ui,sans-serif;">

</svg></figure>
<figure class="diag"><figcaption>caching-2.svg</figcaption><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 268" role="img" aria-label="Cache-aside flow: app checks cache, falls through to database on miss, then populates the cache" style="font:13px/1.3 ui-sans-serif,system-ui,sans-serif;">

    <text x="191" y="150" font-weight="600">Check cache</text>
    <text x="191" y="170" font-size="11">Redis</text>
    <text x="318" y="150" font-weight="600">Read database</text>
    <text x="318" y="170" font-size="11">Postgres</text>
    <text x="445" y="150" font-weight="600">Write to cache</text>

<figure class="diag"><figcaption>caching-3.svg</figcaption><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 262" role="img" aria-label="Thundering herd on cache expiry, before and after request coalescing" style="font:13px/1.3 ui-sans-serif,system-ui,sans-serif;">

<figure class="diag"><figcaption>message-queues-1.svg</figcaption><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" role="img" aria-label="Queue: one consumer per message vs Stream: many independent consumers" style="font:13px/1.3 ui-sans-serif,system-ui,sans-serif;">

    <g fill="currentColor" font-size="11" text-anchor="middle">
      <text x="160" y="65" font-weight="600">last 60 sec</text>
      <text x="160" y="105">window slides with time</text>
    </g>
    <text x="160" y="160" text-anchor="middle" fill="currentColor" font-size="11" opacity="0.85">No edge effect — always counts the last 60 s.</text>
  </g>
</svg></figure>
<figure class="diag"><figcaption>scaling-1.svg</figcaption><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 243" role="img" aria-label="Vertical scaling: one bigger box. Horizontal scaling: many boxes." style="font:13px/1.3 ui-sans-serif,system-ui,sans-serif;">
  <style>
    svg{color:#243044;}

  </style>
  <text x="320" y="22" text-anchor="middle" fill="currentColor" font-weight="600">Vertical vs horizontal scaling</text>
  <g transform="translate(0,45)">
    <text x="160" y="0" text-anchor="middle" fill="currentColor" font-weight="600">Vertical — one bigger box</text>
    <g fill="none" stroke="currentColor" stroke-width="2">
      <rect x="40" y="20" width="60" height="60" rx="8"/>
      <rect class="hl" x="180" y="20" width="80" height="100" rx="8" fill="currentColor" fill-opacity="0.1" stroke="currentColor" />
    </g>
    <g fill="currentColor" text-anchor="middle" font-size="11">
      <text x="70" y="55">app</text>
      <text x="220" y="55" font-weight="600">app</text>
      <text x="220" y="80" font-size="10">8x CPU, RAM</text>
      <text x="220" y="95" font-size="10">faster disk</text>
    </g>
    <text x="160" y="150" text-anchor="middle" fill="currentColor" font-size="11" opacity="0.85">Zero code change. Hard ceiling.</text>
    <text x="160" y="168" text-anchor="middle" fill="currentColor" font-size="11" opacity="0.85">Still one machine to fail.</text>
  </g>
  <g transform="translate(320,45)">
    <text x="160" y="0" text-anchor="middle" fill="currentColor" font-weight="600">Horizontal — many boxes</text>
    <g fill="none" stroke="currentColor" stroke-width="2">
      <rect x="20" y="40" width="50" height="40" rx="6"/>

    </g>
    <text x="160" y="150" text-anchor="middle" fill="currentColor" font-size="11" opacity="0.85">Needs stateless or shardable design.</text>
    <text x="160" y="168" text-anchor="middle" fill="currentColor" font-size="11" opacity="0.85">Fault-tolerant by construction.</text>
  </g>
</svg></figure>
